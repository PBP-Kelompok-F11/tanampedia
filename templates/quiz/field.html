<div>
    {% if field.field.widget.input_type == 'checkbox' %}
    <label for="{{ field.id_for_label }}" class="flex items-center gap-3 font-semibold text-primary-900">{{ field }} {{ field.label }}</label>
    {% else %}
    <label for="{{ field.id_for_label }}" class="mb-2 block font-semibold text-primary-900">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% endif %}
    {% if field.help_text %}<p id="{{ field.auto_id }}_helptext" class="!mb-0 !mt-2 text-sm text-grey-500">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}
    <ul id="{{ field.auto_id }}_error" class="mt-2 list-none p-0 text-sm text-red-700">
        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
    {% endif %}
</div>
